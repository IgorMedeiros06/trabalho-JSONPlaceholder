<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuários</title>
    <link rel="stylesheet" href="style.css">
    <script src="scripts.js" defer></script>
</head>
<body>
    <div class="container">
        <h1 class="sr-only">Lista de usuários</h1>

        <form id="form" role="search">
            <label for="pesquisa" class="sr-only">Pesquisar usuários</label>
            <div class="campo-pesquisa">
                <svg class="icone-pesquisa" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="7"></circle>
                    <path d="m20 20-4-4"></path>
                </svg>
                <input type="search" id="pesquisa" name="pesquisa" placeholder="Pesquise um usuário...">
            </div>

            <p id="n-publi">10 usuários</p>

            <label for="order" id="order-text">
                Ordenar:
                <select name="order" id="order">
                    <option value="AZ">A–Z</option>
                    <option value="ZA">Z–A</option>
                </select>
            </label>
        </form>

        <main class="users" aria-label="Usuários">
        </main>
    </div>
</body>
</html>
